<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGA Fiscal — Reporte de Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0E2EFB;
  --cyan:#1FCDFF;
  --tinta:#0B1533;
  --gris:#5B6784;
  --linea:#D9E2F5;
  --fondo:#F4F7FE;
  --blanco:#FFFFFF;
  --verde:#12A05C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--fondo);
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  padding:32px 24px 64px;
}
.wrap{max-width:1120px;margin:0 auto}

/* Encabezado */
header{margin-bottom:28px}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--azul);margin-bottom:6px
}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.actualizado{font-size:13px;color:var(--gris);margin-top:6px}

/* Pestañas */
nav{display:flex;gap:4px;margin:24px 0 20px;border-bottom:1px solid var(--linea)}
nav button{
  font-family:inherit;font-size:14px;font-weight:500;
  background:none;border:none;cursor:pointer;
  padding:10px 18px;color:var(--gris);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
nav button:hover{color:var(--tinta)}
nav button[aria-selected="true"]{color:var(--azul);border-bottom-color:var(--azul)}
nav button:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px}

.panel{display:none}
.panel.activo{display:block}

/* Tarjetas de etapa */
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.etapa{
  background:var(--blanco);border:1px solid var(--linea);
  border-radius:12px;padding:20px 22px;position:relative;overflow:hidden;
}
.etapa::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--azul)}
.etapa.sql::before{background:var(--cyan)}
.etapa.closed::before{background:var(--verde)}
.etapa .nombre{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.etapa .cifra{font-size:40px;font-weight:600;line-height:1.1;margin-top:8px;letter-spacing:-.03em}
.etapa .pie{font-size:13px;color:var(--gris);margin-top:2px}

/* Embudo */
.embudo{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:24px}
.barra{margin-bottom:18px}
.barra:last-child{margin-bottom:0}
.barra .fila{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.barra .rot{font-size:14px;font-weight:500}
.barra .num{font-size:14px;font-weight:600;color:var(--gris);font-variant-numeric:tabular-nums}
.pista{height:10px;background:var(--fondo);border-radius:5px;overflow:hidden}
.relleno{height:100%;border-radius:5px;transition:width .5s ease}

/* Tablas */
.columnas{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.bloque h2{
  font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:16px 20px;border-bottom:1px solid var(--linea);color:var(--azul)
}
.bloque h2 span{color:var(--gris);font-weight:500;margin-left:6px}
table{width:100%;border-collapse:collapse}
th{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gris);text-align:left;padding:10px 20px;border-bottom:1px solid var(--linea)
}
td{padding:12px 20px;font-size:14px;border-bottom:1px solid var(--fondo);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--fondo)}
.empresa{font-weight:500}
.meta{font-size:12px;color:var(--gris);margin-top:2px}
.num-col{text-align:right;font-variant-numeric:tabular-nums}
.etiqueta{
  display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:#E8EDFF;color:var(--azul)
}
.etiqueta.despachos{background:#E0F8FF;color:#0A7FA0}
.etiqueta.mailchimp{background:#EDE8FF;color:#5B3BC4}

/* Gráfica de tendencia */
.grafica{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:24px}
.leyenda{display:flex;gap:20px;margin-bottom:18px;font-size:13px;color:var(--gris)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg{width:100%;height:auto;display:block}

.aviso{
  background:var(--blanco);border:1px solid var(--linea);border-radius:12px;
  padding:40px 24px;text-align:center;color:var(--gris);font-size:14px
}
.aviso.error{border-color:#F3C9C9;background:#FFF6F6;color:#9B2C2C}

@media(max-width:760px){
  body{padding:20px 14px 48px}
  .etapas{grid-template-columns:1fr}
  .columnas{grid-template-columns:1fr}
  h1{font-size:24px}
  nav{overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">SAGA Fiscal</div>
  <h1>Reporte de Pipeline</h1>
  <div class="actualizado" id="actualizado">Cargando datos…</div>
</header>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-panel="funnel">Funnel</button>
  <button role="tab" aria-selected="false" data-panel="empresas">Empresas</button>
  <button role="tab" aria-selected="false" data-panel="tendencia">Tendencia</button>
</nav>

<section class="panel activo" id="funnel">
  <div class="etapas">
    <div class="etapa"><div class="nombre">MQL</div><div class="cifra" id="c-mql">—</div><div class="pie">Demo agendada</div></div>
    <div class="etapa sql"><div class="nombre">SQL</div><div class="cifra" id="c-sql">—</div><div class="pie">Probando o en cierre</div></div>
    <div class="etapa closed"><div class="nombre">Cerrado</div><div class="cifra" id="c-closed">—</div><div class="pie">Cuenta ganada</div></div>
  </div>
  <div class="embudo" id="embudo"></div>
</section>

<section class="panel" id="empresas">
  <div class="columnas">
    <div class="bloque">
      <h2>MQL <span id="n-mql"></span></h2>
      <div id="t-mql"></div>
    </div>
    <div class="bloque">
      <h2>SQL <span id="n-sql"></span></h2>
      <div id="t-sql"></div>
    </div>
  </div>
</section>

<section class="panel" id="tendencia">
  <div class="grafica">
    <div class="leyenda">
      <span><i style="background:#0E2EFB"></i>MQL</span>
      <span><i style="background:#1FCDFF"></i>SQL</span>
      <span><i style="background:#12A05C"></i>Cerrado</span>
    </div>
    <div id="g-tendencia"><div class="aviso">Cargando…</div></div>
  </div>
</section>

</div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzysMBLi6lj5jSzBT_n8b05oOEXCgsanTyowGQ81fg_Eu9DQ7cBmjX5GPcjFsuLJcXEBg/exec';

/* Pestañas */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('activo'));
    document.getElementById(b.dataset.panel).classList.add('activo');
  });
});

/* Lector de CSV que respeta comillas */
function leerCSV(texto){
  const filas=[];let fila=[];let campo='';let entre=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(entre){
      if(c==='"'){ if(texto[i+1]==='"'){campo+='"';i++;} else entre=false; }
      else campo+=c;
    }else{
      if(c==='"') entre=true;
      else if(c===','){fila.push(campo);campo='';}
      else if(c==='\n'){fila.push(campo);filas.push(fila);fila=[];campo='';}
      else if(c!=='\r') campo+=c;
    }
  }
  if(campo!==''||fila.length){fila.push(campo);filas.push(fila);}
  return filas;
}

/* Las fechas llegan como texto largo de JavaScript; aquí se normalizan */
function aFecha(v){
  if(!v) return null;
  const d=new Date(v);
  return isNaN(d.getTime())?null:d;
}
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(d){ return d.getDate()+' '+MESES[d.getMonth()]; }

function tabla(filas){
  if(!filas.length) return '<div class="aviso">Sin cuentas en esta etapa.</div>';
  let h='<table><thead><tr><th>Empresa</th><th class="num-col">CFDIs</th></tr></thead><tbody>';
  filas.forEach(f=>{
    const origen=(f.origen||'').toLowerCase();
    const vol=f.volumen?Number(f.volumen).toLocaleString('es-MX'):'—';
    h+=`<tr><td><div class="empresa">${f.empresa}</div>
        <div class="meta">${f.contacto||''}</div>
        <div class="meta"><span class="etiqueta ${origen}">${f.origen||'—'}</span></div></td>
        <td class="num-col">${vol}</td></tr>`;
  });
  return h+'</tbody></table>';
}

function embudo(mql,sql,closed){
  const total=Math.max(mql,sql,closed,1);
  const datos=[
    {rot:'MQL — Demo agendada',n:mql,color:'#0E2EFB'},
    {rot:'SQL — Probando o en cierre',n:sql,color:'#1FCDFF'},
    {rot:'Cerrado — Cuenta ganada',n:closed,color:'#12A05C'}
  ];
  return datos.map(d=>`<div class="barra">
    <div class="fila"><span class="rot">${d.rot}</span><span class="num">${d.n}</span></div>
    <div class="pista"><div class="relleno" style="width:${(d.n/total*100).toFixed(1)}%;background:${d.color}"></div></div>
  </div>`).join('');
}

function grafica(serie){
  if(serie.length<2) return '<div class="aviso">Se necesitan al menos dos cortes para dibujar la tendencia.</div>';
  const W=900,H=320,mI=44,mD=16,mS=16,mB=42;
  const aW=W-mI-mD,aH=H-mS-mB;
  const max=Math.max(...serie.flatMap(p=>[p.mql,p.sql,p.closed]),1);
  const techo=Math.ceil(max/5)*5||5;
  const x=i=>mI+(serie.length===1?aW/2:i*aW/(serie.length-1));
  const y=v=>mS+aH-(v/techo*aH);

  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución diaria del pipeline">`;
  for(let t=0;t<=techo;t+=Math.max(1,Math.round(techo/5))){
    g+=`<line x1="${mI}" y1="${y(t)}" x2="${W-mD}" y2="${y(t)}" stroke="#E8EEFB"/>`;
    g+=`<text x="${mI-10}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#5B6784" font-family="Outfit">${t}</text>`;
  }
  const paso=Math.ceil(serie.length/8);
  serie.forEach((p,i)=>{
    if(i%paso===0||i===serie.length-1)
      g+=`<text x="${x(i)}" y="${H-16}" text-anchor="middle" font-size="11" fill="#5B6784" font-family="Outfit">${fechaCorta(p.fecha)}</text>`;
  });
  [['mql','#0E2EFB'],['sql','#1FCDFF'],['closed','#12A05C']].forEach(([k,c])=>{
    const d=serie.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    serie.forEach((p,i)=>{g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"><title>${fechaCorta(p.fecha)} — ${k.toUpperCase()}: ${p[k]}</title></circle>`;});
  });
  return g+'</svg>';
}

async function cargar(){
  try{
    const [rp,rt]=await Promise.all([fetch(ENDPOINT),fetch(ENDPOINT+'?sheet=tendencia')]);
    const pipeline=leerCSV(await rp.text());
    const tend=leerCSV(await rt.text());

    /* Pipeline Activo: fila 1 título, fila 2 encabezados, datos desde la fila 3 */
    const cuentas=pipeline.slice(2)
      .filter(f=>f[0]&&f[0].trim())
      .map(f=>({empresa:f[0].trim(),contacto:(f[1]||'').trim(),origen:(f[6]||'').trim(),
                etapa:(f[7]||'').trim(),volumen:(f[8]||'').trim()}));

    const mql=cuentas.filter(c=>c.etapa==='MQL');
    const sql=cuentas.filter(c=>c.etapa==='SQL');
    const closed=cuentas.filter(c=>c.etapa==='Closed');

    document.getElementById('c-mql').textContent=mql.length;
    document.getElementById('c-sql').textContent=sql.length;
    document.getElementById('c-closed').textContent=closed.length;
    document.getElementById('embudo').innerHTML=embudo(mql.length,sql.length,closed.length);
    document.getElementById('n-mql').textContent=`(${mql.length})`;
    document.getElementById('n-sql').textContent=`(${sql.length})`;
    document.getElementById('t-mql').innerHTML=tabla(mql);
    document.getElementById('t-sql').innerHTML=tabla(sql);

    /* Tendencia: fila 1 encabezados, columna A con fecha real */
    const serie=tend.slice(1)
      .map(f=>({fecha:aFecha(f[0]),mql:+f[1]||0,sql:+f[2]||0,closed:+f[3]||0}))
      .filter(p=>p.fecha)
      .sort((a,b)=>a.fecha-b.fecha);
    document.getElementById('g-tendencia').innerHTML=grafica(serie);

    const ultimo=serie.length?serie[serie.length-1].fecha:null;
    document.getElementById('actualizado').textContent=
      ultimo?`Último corte: ${ultimo.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})} · ${cuentas.length} cuentas activas`
            :`${cuentas.length} cuentas activas`;
  }catch(e){
    document.getElementById('actualizado').textContent='No se pudieron cargar los datos.';
    document.getElementById('embudo').innerHTML='<div class="aviso error">No hay conexión con la hoja. Revisa que el web app siga publicado con acceso para cualquier usuario.</div>';
    document.getElementById('g-tendencia').innerHTML='<div class="aviso error">Sin datos de tendencia.</div>';
  }
}
cargar();
</script>
</body>
</html>
